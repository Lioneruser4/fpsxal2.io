<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Karakter Odaları</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #e8e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #scene { position: fixed; inset: 0; z-index: 0; display: block; }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(10,10,18,0.95), transparent);
      pointer-events: none;
    }
    #topbar h1 { font-size: 16px; font-weight: 600; color: #a0a0ff; }
    #status { font-size: 12px; color: #6a6a8a; }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }

    #charBar {
      position: fixed; top: 56px; left: 20px; z-index: 10;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .charBtn {
      background: rgba(30,30,50,0.9);
      border: 1px solid rgba(100,100,180,0.3);
      color: #c8c8e0;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }
    .charBtn:hover { border-color: #7a7aff; background: rgba(50,50,90,0.9); }
    .charBtn.active { background: #5a5aff; color: #fff; border-color: #7a7aff; }

    #chatPanel {
      position: fixed; right: 20px; bottom: 20px; z-index: 10;
      width: 360px; height: 480px;
      background: rgba(18,18,32,0.95);
      border: 1px solid rgba(100,100,180,0.25);
      border-radius: 16px;
      display: flex; flex-direction: column;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    #chatHeader {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(100,100,180,0.2);
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    #chatHeader .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
      font-size: 13px; line-height: 1.5;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }
    .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; }
    .msg.user { align-self: flex-end; background: #5a5aff; color: #fff; }
    .msg.ai { align-self: flex-start; background: rgba(40,40,70,0.8); color: #d8d8e8; }
    .msg .name { font-size: 10px; opacity: 0.6; margin-bottom: 3px; display: block; }
    .msg.typing::after { content: "●●●"; animation: blink 1.2s infinite; }
    @keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

    #inputRow {
      display: flex; gap: 8px; padding: 12px;
      border-top: 1px solid rgba(100,100,180,0.2);
    }
    #chatInput {
      flex: 1; background: rgba(30,30,50,0.8);
      border: 1px solid rgba(100,100,180,0.3);
      color: #e8e8f0; padding: 10px 14px;
      border-radius: 10px; font-size: 13px; outline: none;
      font-family: inherit;
    }
    #chatInput:focus { border-color: #7a7aff; }
    #sendBtn {
      background: #5a5aff; border: none; color: #fff;
      padding: 0 18px; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 600;
    }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    #cmdRow {
      position: fixed; left: 20px; bottom: 20px; z-index: 10;
      width: 320px;
      background: rgba(18,18,32,0.95);
      border: 1px solid rgba(180,100,255,0.3);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    #cmdRow label {
      font-size: 11px; color: #b080ff; display: block; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    }
    #cmdInput {
      width: 100%; background: rgba(30,30,50,0.8);
      border: 1px solid rgba(180,100,255,0.3);
      color: #e8e8f0; padding: 10px 12px;
      border-radius: 10px; font-size: 13px; outline: none;
      font-family: inherit; margin-bottom: 8px;
    }
    #cmdInput:focus { border-color: #b080ff; }
    #cmdBtn {
      width: 100%; background: linear-gradient(135deg,#7a3aff,#b080ff);
      border: none; color: #fff; padding: 10px;
      border-radius: 10px; cursor: pointer; font-weight: 600;
      font-size: 13px;
    }
    #cmdBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    #loading {
      position: fixed; inset: 0; z-index: 100;
      background: #0a0a12;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(100,100,180,0.3);
      border-top-color: #7a7aff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #6a6a8a; font-size: 13px; }

    @media (max-width: 700px) {
      #chatPanel { width: calc(100% - 40px); height: 45vh; }
      #cmdRow { width: calc(100% - 40px); bottom: auto; top: 110px; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>3D dünya yükleniyor…</p>
  </div>

  <canvas id="scene"></canvas>

  <div id="topbar">
    <h1>🏠 AI Karakter Odaları</h1>
    <span id="status">bağlanıyor…</span>
  </div>

  <div id="charBar"></div>

  <div id="chatPanel">
    <div id="chatHeader">
      <span class="dot"></span>
      <span id="chatTitle">Sohbet</span>
    </div>
    <div id="messages"></div>
    <div id="inputRow">
      <input id="chatInput" placeholder="Bir şey yaz…" />
      <button id="sendBtn">Gönder</button>
    </div>
  </div>

  <div id="cmdRow">
    <label>⚡ Emir Ver</label>
    <input id="cmdInput" placeholder='örn. "odayı temizle", "masaya otur"' />
    <button id="cmdBtn">Emri Uygula</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
