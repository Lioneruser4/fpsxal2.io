<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kelime Oyunu</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background:#050510;
    color:#fff; user-select:none;
    touch-action:none;
  }

  /* ═══ ANA GRID ═══ */
  #app {
    display:grid;
    grid-template-rows: auto 1fr auto;
    width:100vw; height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ═══ ÜST — İPUCU ═══ */
  #top {
    padding: 8px 10px;
    background: linear-gradient(180deg, #1a0033, #0a0018);
    border-bottom:1px solid rgba(255,100,220,.3);
    text-align:center;
    z-index:2;
  }
  #top .label {
    font-size: 11px; color:#ff7ae0; letter-spacing:2px;
    text-transform:uppercase; opacity:.8;
  }
  #hint {
    font-size: clamp(14px, 3.6vw, 20px);
    font-weight:600;
    color:#a0e0ff;
    margin-top:2px;
  }
  #hint b { color:#ffd700; }
  #meta {
    font-size: 11px; color:#888; margin-top:2px;
  }

  /* ═══ ORTA — OYUN ═══ */
  #game {
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: clamp(8px, 2vh, 20px);
    padding: 10px;
    background: radial-gradient(circle at 50% 40%, rgba(150,0,255,.15), transparent 65%);
    position:relative; overflow:hidden;
  }

  #mask {
    display:flex; gap: clamp(4px, 1.5vw, 8px);
    flex-wrap:wrap; justify-content:center;
    max-width:95vw;
  }
  .letter-box {
    width: clamp(30px, 8vw, 52px);
    height: clamp(38px, 9vw, 62px);
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(180deg, #2a1040, #180828);
    border:2px solid rgba(255,100,220,.5);
    border-radius:10px;
    font-size: clamp(18px, 4.5vw, 30px);
    font-weight:800;
    color:#ff7ae0;
    transition: all .35s;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.3);
  }
  .letter-box.revealed {
    background: linear-gradient(180deg, #ffd700, #ff9500);
    border-color:#ffd700;
    color:#1a0033;
    box-shadow: 0 0 20px rgba(255,215,0,.7), inset 0 -4px 0 rgba(0,0,0,.3);
    transform: scale(1.06);
  }

  #foundFlash {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-size: clamp(20px, 5vw, 36px);
    font-weight:800; text-align:center;
    background: rgba(0,0,0,.85);
    color:#ffd700;
    text-shadow:0 0 30px rgba(255,215,0,.9);
    opacity:0; pointer-events:none;
    transition: opacity .3s;
    padding:20px; z-index:10;
    line-height:1.4;
  }
  #foundFlash.show { opacity:1; animation: pop .5s ease; }
  #foundFlash small { font-size:.5em; color:#a0e0ff; margin-top:8px; font-weight:400; }
  @keyframes pop {
    0% { transform: scale(.7); }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  /* ═══ ALT — SKOR TABLOLARI ═══ */
  #bottom {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:6px;
    padding: 6px 8px 8px;
    background: linear-gradient(0deg, #1a0033, #0a0018);
    border-top:1px solid rgba(255,100,220,.3);
    height: clamp(120px, 22vh, 200px);
    overflow:hidden;
  }
  .board {
    display:flex; flex-direction:column;
    background: rgba(255,255,255,.03);
    border:1px solid rgba(255,100,220,.25);
    border-radius:10px;
    padding:6px 8px;
    overflow:hidden;
  }
  .board h3 {
    font-size: clamp(10px, 2.4vw, 13px);
    text-align:center; margin-bottom:4px;
    letter-spacing:1px; text-transform:uppercase;
    color:#ff7ae0;
    flex-shrink:0;
  }
  .board .list {
    flex:1;
    overflow-y:auto;
    display:flex; flex-direction:column; gap:2px;
    -webkit-overflow-scrolling:touch;
  }
  .board .list::-webkit-scrollbar { width:3px; }
  .board .list::-webkit-scrollbar-thumb { background:#ff7ae0; border-radius:3px; }

  .row {
    display:flex; align-items:center;
    padding: 2px 6px;
    border-radius:4px;
    font-size: clamp(10px, 2.2vw, 13px);
    background: rgba(255,255,255,.03);
    min-height:18px;
  }
  .row .rank { color:#ff7ae0; font-weight:800; width:18px; flex-shrink:0; }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .score { color:#ffd700; font-weight:800; margin-left:4px; }
  .row:nth-child(1) { background: rgba(255,215,0,.15); }
  .row:nth-child(2) { background: rgba(192,192,192,.1); }
  .row:nth-child(3) { background: rgba(205,127,50,.1); }
  .empty { opacity:.4; text-align:center; font-size:11px; margin-top:8px; }

  #rightBoard .row .score { color:#ff7ae0; }

  /* ═══ AYARLAR BUTONU ═══ */
  #settingsBtn {
    position:fixed; top:6px; right:6px;
    width:36px; height:36px;
    border-radius:50%;
    background: rgba(255,100,220,.2);
    border:1px solid rgba(255,100,220,.5);
    color:#ff7ae0; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:100;
    transition: all .2s;
  }
  #settingsBtn:active { transform: scale(.9); background: rgba(255,100,220,.4); }

  /* ═══ MODAL ═══ */
  #modal {
    position:fixed; inset:0; z-index:200;
    background: rgba(0,0,0,.92);
    display:none;
    align-items:center; justify-content:center;
    padding:16px;
  }
  #modal.show { display:flex; }
  #modalBox {
    width:100%; max-width:420px;
    background: linear-gradient(160deg, #1a0033, #0a0018);
    border:2px solid rgba(255,100,220,.5);
    border-radius:16px;
    padding:16px;
    max-height:90vh;
    display:flex; flex-direction:column;
    box-shadow: 0 0 40px rgba(255,100,220,.4);
  }
  #modalBox h2 {
    color:#ff7ae0; font-size:16px; margin-bottom:10px;
    text-align:center; letter-spacing:1px;
  }
  #modalBox label {
    font-size:12px; color:#a0e0ff; margin-top:6px; margin-bottom:3px; display:block;
  }
  #modalBox input, #modalBox textarea {
    width:100%;
    padding:8px 10px;
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,100,220,.4);
    border-radius:8px;
    color:#fff; font-size:14px;
    font-family:inherit;
    outline:none;
  }
  #modalBox input:focus, #modalBox textarea:focus { border-color:#ff7ae0; }
  #modalBox textarea {
    resize:none; flex:1; min-height:100px;
    font-family: monospace; font-size:13px;
  }
  .hintText { font-size:10px; color:#666; margin-top:2px; }
  #modalActions {
    display:flex; gap:8px; margin-top:12px;
  }
  #modalActions button {
    flex:1; padding:10px; border:none; border-radius:8px;
    font-size:14px; font-weight:700;
    cursor:pointer; transition: all .2s;
  }
  #btnCancel { background:#333; color:#aaa; }
  #btnSave { background: linear-gradient(90deg, #ff7ae0, #ff4dc4); color:#fff; }
  #btnSave:active, #btnCancel:active { transform: scale(.97); }

  /* ═══ SES BAŞLAT ═══ */
  #tapStart {
    position:fixed; inset:0; z-index:999;
    background: #050510;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:16px;
    color:#ff7ae0; font-size: clamp(16px, 4vw, 22px);
    text-align:center; padding:30px; cursor:pointer;
  }
  #tapStart .big { font-size: clamp(40px, 12vw, 80px); }
  #tapStart.hidden { display:none; }

  /* ═══ KONFETİ ═══ */
  .confetti {
    position:fixed; width:8px; height:8px;
    pointer-events:none; z-index:150;
    animation: fall 2s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>

<div id="tapStart">
  <div class="big">🎮</div>
  <div>Oyunu başlatmaq üçün toxun</div>
</div>

<div id="settingsBtn">⚙️</div>

<div id="app">
  <!-- ÜST: İpucu -->
  <div id="top">
    <div class="label">KƏLİMƏ TAP</div>
    <div id="hint">Yüklənir...</div>
    <div id="meta"></div>
  </div>

  <!-- ORTA: Oyun -->
  <div id="game">
    <div id="mask"></div>
    <div id="foundFlash"></div>
  </div>

  <!-- ALT: Skor tabloları -->
  <div id="bottom">
    <div class="board" id="leftBoard">
      <h3>🏆 Oyunçular</h3>
      <div class="list" id="leftList"></div>
    </div>
    <div class="board" id="rightBoard">
      <h3>🎁 Hədiyyə</h3>
      <div class="list" id="rightList"></div>
    </div>
  </div>
</div>

<!-- Ayarlar Modal -->
<div id="modal">
  <div id="modalBox">
    <h2>⚙️ KƏLİMƏLƏR</h2>
    <label>Yeni kelime ekle</label>
    <input id="newWord" placeholder="Məsələn: BAYRAQ" maxlength="20">
    <label>İpucu (istəyə bağlı)</label>
    <input id="newHint" placeholder="Məsələn: Dövlət simvolu" maxlength="60">
    <label style="margin-top:10px;">Kelime listesi (her setir: KELİME|ipucu)</label>
    <textarea id="wordsText" placeholder="BAYRAQ|Dövlət simvolu&#10;ALMA|Qırmızı meyvə"></textarea>
    <div class="hintText">Boş buraxsan default kelimeler istifadə olunur.</div>
    <div id="modalActions">
      <button id="btnCancel">Ləğv et</button>
      <button id="btnSave">Yadda saxla</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   AYARLAR
   ═══════════════════════════════════════════════ */
const WS_URL = location.origin.replace(/^http/, 'ws');
const TEST_MODE = new URLSearchParams(location.search).has('test');

/* ═══════════════════════════════════════════════
   DEFAULT KELİMELER (tek söz)
   ═══════════════════════════════════════════════ */
const DEFAULT_WORDS = [
  { word: 'BAYRAQ', hint: 'Dövlət simvolu' },
  { word: 'BAKI', hint: 'Paytaxt' },
  { word: 'ŞƏKİ', hint: 'Şirniyyat şəhəri' },
  { word: 'XƏZƏR', hint: 'Dəniz' },
  { word: 'ALMA', hint: 'Qırmızı meyvə' },
  { word: 'ARMUD', hint: 'Sarı meyvə' },
  { word: 'ÜZÜM', hint: 'Salxım meyvə' },
  { word: 'NAR', hint: 'Dənəli meyvə' },
  { word: 'ASLAN', hint: 'Heyvanlar şahı' },
  { word: 'QARTAL', hint: 'Uçan quş' },
  { word: 'BÜLBÜL', hint: 'Oxuyan quş' },
  { word: 'GÜNƏŞ', hint: 'İşıq mənbəyi' },
  { word: 'ULDUZ', hint: 'Gecə parlayır' },
  { word: 'DƏNİZ', hint: 'Su hövzəsi' },
  { word: 'DAĞ', hint: 'Yüksəklik' },
  { word: 'ÇAY', hint: 'Axan su' },
  { word: 'KİTAB', hint: 'Oxumaq üçün' },
  { word: 'MƏKTƏB', hint: 'Təhsil yeri' },
  { word: 'MÜƏLLİM', hint: 'Dərs deyən' },
  { word: 'ŞAGİRD', hint: 'Oxuyan' },
  { word: 'ANA', hint: 'Valideyn' },
  { word: 'ATA', hint: 'Valideyn' },
  { word: 'QARDAŞ', hint: 'Ailə üzvü' },
  { word: 'DOST', hint: 'Yaxın insan' },
  { word: 'ÜRƏK', hint: 'Orqan' },
  { word: 'GÖZ', hint: 'Görmə orqanı' },
  { word: 'PİŞİK', hint: 'Ev heyvanı' },
  { word: 'İT', hint: 'Sadiq heyvan' },
  { word: 'AT', hint: 'Minilən' },
  { word: 'İNƏK', hint: 'Süd verən' },
  { word: 'BALIQ', hint: 'Suda yaşayan' },
  { word: 'ÇÖRƏK', hint: 'Əsas qida' },
  { word: 'PLOV', hint: 'Milli yemək' },
  { word: 'DOLMA', hint: 'Milli yemək' },
  { word: 'KABAB', hint: 'Odda bişən' },
  { word: 'ŞƏKƏR', hint: 'Şirin' },
  { word: 'BAL', hint: 'Arı məhsulu' },
  { word: 'SÜD', hint: 'Ağ içki' },
  { word: 'SU', hint: 'Şəffaf' },
  { word: 'QAR', hint: 'Ağ yağış' },
  { word: 'YAĞIŞ', hint: 'Göydən' },
  { word: 'KÜLƏK', hint: 'Əsən hava' },
  { word: 'BAHAR', hint: 'Fəsil' },
  { word: 'YAY', hint: 'Fəsil' },
  { word: 'PAYIZ', hint: 'Fəsil' },
  { word: 'QIŞ', hint: 'Fəsil' },
  { word: 'MAŞIN', hint: 'Nəqliyyat' },
  { word: 'GƏMİ', hint: 'Su nəqliyyatı' },
  { word: 'TELEFON', hint: 'Rabitə' },
  { word: 'SAAT', hint: 'Vaxt' },
  { word: 'QAPI', hint: 'Giriş' },
  { word: 'STOL', hint: 'Yemək yeri' },
  { word: 'STUL', hint: 'Oturmaq' },
  { word: 'ÇİÇƏK', hint: 'Gözəl bitki' },
  { word: 'AĞAC', hint: 'Böyük bitki' },
  { word: 'MEŞƏ', hint: 'Ağac çoxluğu' },
  { word: 'TORPAQ', hint: 'Yer' },
  { word: 'DAŞ', hint: 'Sərt cisim' },
  { word: 'QIZIL', hint: 'Qiymətli metal' },
  { word: 'GÜMÜŞ', hint: 'Qiymətli metal' },
  { word: 'DƏMİR', hint: 'Metal' },
  { word: 'PUL', hint: 'Ödəniş' },
  { word: 'UŞAQ', hint: 'Balaca insan' },
  { word: 'QOCA', hint: 'Yaşlı' },
  { word: 'GƏNC', hint: 'Cavan' },
  { word: 'ŞƏHƏR', hint: 'Yaşayış yeri' },
  { word: 'KƏND', hint: 'Kiçik yaşayış yeri' },
  { word: 'EV', hint: 'Yaşayış binası' },
  { word: 'YOL', hint: 'Gediş yeri' },
  { word: 'KÖRPÜ', hint: 'Çay üzərində' },
  { word: 'BAĞ', hint: 'Meyvə yeri' },
  { word: 'BUĞDA', hint: 'Dənli bitki' },
  { word: 'DÜYÜ', hint: 'Plovun əsası' },
  { word: 'LALƏ', hint: 'Qırmızı çiçək' },
];

/* ═══════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════ */
let WORDS = loadWords();
let currentWord = null;
let players = {};
let gifters = {};
let usedWords = new Set();

function loadWords() {
  try {
    const saved = localStorage.getItem('customWords');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch {}
  return DEFAULT_WORDS.slice();
}
function saveWords(words) {
  try { localStorage.setItem('customWords', JSON.stringify(words)); } catch {}
}

/* ═══════════════════════════════════════════════
   SES
   ═══════════════════════════════════════════════ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration = 0.15, type = 'sine', vol = 0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playCorrect() {
  [523, 659, 784, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, .18, 'sine', .22), i * 100);
  });
}
function playGift() {
  playTone(880, .08, 'triangle', .15);
  setTimeout(() => playTone(1108, .1, 'triangle', .15), 80);
}

/* ═══════════════════════════════════════════════
   OYUN MANTIĞI
   ═══════════════════════════════════════════════ */
function pickWord() {
  const remaining = WORDS.filter(w => !usedWords.has(w.word));
  if (remaining.length === 0) usedWords.clear();
  const pool = remaining.length ? remaining : WORDS;
  currentWord = pool[Math.floor(Math.random() * pool.length)];
  usedWords.add(currentWord.word);
  renderHint();
}

function renderHint() {
  const w = currentWord.word;
  document.getElementById('hint').innerHTML =
    `${currentWord.hint || '—'} <b>(${w.length} hərf)</b>`;
  document.getElementById('meta').textContent = 'İlk hərf: ' + w[0];

  const mask = document.getElementById('mask');
  mask.innerHTML = '';
  for (let i = 0; i < w.length; i++) {
    const box = document.createElement('div');
    box.className = 'letter-box';
    box.textContent = i === 0 ? w[i] : '';
    if (i === 0) box.classList.add('revealed');
    mask.appendChild(box);
  }
}

function checkAnswer(user, text) {
  if (!currentWord) return false;
  const upperText = text.toUpperCase();
  if (upperText.includes(currentWord.word)) {
    correctAnswer(user);
    return true;
  }
  return false;
}

function correctAnswer(user) {
  players[user] = (players[user] || 0) + 10;
  renderBoards();

  const flash = document.getElementById('foundFlash');
  flash.innerHTML = `🎉 ${user}<small>"${currentWord.word}" — düzgün tapdı!</small>`;
  flash.classList.add('show');
  playCorrect();
  confetti();

  const boxes = document.querySelectorAll('.letter-box');
  boxes.forEach((b, i) => {
    setTimeout(() => {
      b.textContent = currentWord.word[i];
      b.classList.add('revealed');
    }, i * 80);
  });

  setTimeout(() => {
    flash.classList.remove('show');
    pickWord();
  }, 2500);
}

/* ═══════════════════════════════════════════════
   KONFETİ
   ═══════════════════════════════════════════════ */
function confetti() {
  const colors = ['#ff7ae0', '#ffd700', '#00e5ff', '#7cff00', '#ff5050', '#a070ff'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = (1.5 + Math.random()) + 's';
    if (Math.random() > .5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

/* ═══════════════════════════════════════════════
   SKOR TABLOLARI
   ═══════════════════════════════════════════════ */
function renderBoards() {
  // Sol: Oyuncular top 10
  const sortedP = Object.entries(players).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const leftList = document.getElementById('leftList');
  leftList.innerHTML = sortedP.length ? '' :
    '<div class="empty">Hələ oyunçu yoxdur</div>';
  sortedP.forEach(([name, score], i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="rank">${i + 1}</span><span class="name">${name}</span><span class="score">${score}</span>`;
    leftList.appendChild(row);
  });

  // Sağ: Hediye atanlar top 10
  const sortedG = Object.entries(gifters).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const rightList = document.getElementById('rightList');
  rightList.innerHTML = sortedG.length ? '' :
    '<div class="empty">Hələ hədiyyə yoxdur</div>';
  sortedG.forEach(([name, val], i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="rank">${i + 1}</span><span class="name">${name}</span><span class="score">${val}</span>`;
    rightList.appendChild(row);
  });
}

/* ═══════════════════════════════════════════════
   WEBSOCKET
   ═══════════════════════════════════════════════ */
let ws = null;
function connectWS() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'hello', role: 'viewer' }));
    ws.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'comment') checkAnswer(msg.user, msg.text);
        if (msg.type === 'gift') handleGift(msg.user, msg.gift, msg.count || 1);
      } catch {}
    };
    ws.onclose = () => setTimeout(connectWS, 2000);
    ws.onerror = () => ws.close();
  } catch {
    setTimeout(connectWS, 2000);
  }
}
connectWS();

function handleGift(user, giftName, count) {
  const value = (giftValue(giftName) || 1) * count;
  gifters[user] = (gifters[user] || 0) + value;
  renderBoards();
  playGift();
  const flash = document.getElementById('foundFlash');
  flash.innerHTML = `🎁 ${user}<small>${giftName} göndərdi!</small>`;
  flash.classList.add('show');
  setTimeout(() => {
    if (!flash.dataset.keep) flash.classList.remove('show');
  }, 1500);
}

function giftValue(name) {
  const map = { 'Rose': 1, 'TikTok': 1, 'Finger Heart': 5, 'Heart': 1, 'GG': 1, 'Doughnut': 30 };
  return map[name] || 1;
}

/* ═══════════════════════════════════════════════
   AYARLAR MODAL
   ═══════════════════════════════════════════════ */
const modal = document.getElementById('modal');
const wordsText = document.getElementById('wordsText');

document.getElementById('settingsBtn').addEventListener('click', () => {
  // Mevcut kelimeleri textarea'ya dök
  wordsText.value = WORDS.map(w => `${w.word}|${w.hint || ''}`).join('\n');
  modal.classList.add('show');
});

document.getElementById('btnCancel').addEventListener('click', () => {
  modal.classList.remove('show');
});

document.getElementById('btnSave').addEventListener('click', () => {
  const newWord = document.getElementById('newWord').value.trim().toUpperCase();
  const newHint = document.getElementById('newHint').value.trim();

  let parsed = wordsText.value.split('\n').map(line => {
    const [w, h] = line.split('|');
    return { word: (w || '').trim().toUpperCase(), hint: (h || '').trim() };
  }).filter(x => x.word);

  if (newWord) {
    parsed.unshift({ word: newWord, hint: newHint });
  }

  if (parsed.length === 0) {
    alert('Ən azı bir kelime lazımdır!');
    return;
  }

  WORDS = parsed;
  saveWords(WORDS);
  usedWords.clear();

  document.getElementById('newWord').value = '';
  document.getElementById('newHint').value = '';
  modal.classList.remove('show');

  pickWord(); // yeni kelime seç
  renderBoards();
});

// Modal dışına tıklayınca kapat
modal.addEventListener('click', e => {
  if (e.target === modal) modal.classList.remove('show');
});
