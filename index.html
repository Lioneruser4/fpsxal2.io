<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Karakter Odaları</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #05050a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    /* ── 2D DÜNYA ── */
    #world {
      position: fixed; inset: 0; z-index: 1;
      background:
        radial-gradient(circle at 50% 0%, rgba(90,90,255,0.15), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(180,80,255,0.1), transparent 60%),
        #05050a;
      overflow: hidden;
    }

    /* Izgara arka plan */
    #grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(90,90,180,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90,90,180,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 80%);
    }

    /* Odalar */
    .room {
      position: absolute;
      width: 150px; height: 150px;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      transform: translate(-50%, -50%);
    }
    @media (min-width: 600px) {
      .room { width: 180px; height: 180px; }
    }
    .room:hover { transform: translate(-50%, -50%) scale(1.08); }
    .room.active {
      box-shadow: 0 0 0 3px currentColor, 0 0 40px currentColor;
    }
    .room .floor {
      position: absolute; inset: 0; border-radius: 50%;
      opacity: 0.25;
      filter: blur(2px);
    }
    .room .wall {
      position: absolute; inset: 15%;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0.5;
    }
    .room .label {
      position: relative; z-index: 2;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 3px 10px; border-radius: 10px;
      background: rgba(0,0,0,0.7);
      border: 1px solid currentColor;
    }

    /* Karakterler */
    .char {
      position: absolute;
      width: 70px;
      display: flex; flex-direction: column;
      align-items: center;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.25s;
      z-index: 5;
    }
    .char:active { transform: translate(-50%, -50%) scale(0.95); }
    .char .avatar {
      width: 54px; height: 54px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      border: 2.5px solid currentColor;
      box-shadow: 0 0 20px currentColor, inset 0 0 15px rgba(255,255,255,0.15);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), transparent 70%);
      animation: bob 2.5s ease-in-out infinite;
    }
    @keyframes bob {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .char .name {
      font-size: 10px; font-weight: 700;
      margin-top: 5px;
      padding: 2px 8px; border-radius: 8px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      white-space: nowrap;
    }
    .char.active .avatar {
      box-shadow: 0 0 30px currentColor, 0 0 60px currentColor, inset 0 0 20px rgba(255,255,255,0.2);
    }
    .char.active .name {
      background: currentColor;
      color: #000;
    }

    /* Konuşma balonu */
    .char .bubble {
      position: absolute;
      bottom: 100%; left: 50%;
      transform: translateX(-50%) translateY(-8px);
      max-width: 200px; min-width: 100px;
      padding: 10px 14px;
      background: #fff; color: #111;
      border-radius: 14px;
      font-size: 11px; line-height: 1.4;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      white-space: normal;
      z-index: 10;
    }
    .char .bubble::after {
      content: '';
      position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: #fff;
    }
    .char .bubble.show { opacity: 1; }

    /* ── ÜST BAR ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(5,5,10,0.95), transparent);
      pointer-events: none;
    }
    #topbar .logo {
      font-size: 15px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(90deg,#7a7aff,#b080ff,#ff6ec7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #serverStatus {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 600;
      padding: 5px 10px; border-radius: 20px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #serverStatus .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #fbbf24; box-shadow: 0 0 8px #fbbf24;
      animation: pulse 1.5s infinite;
    }
    #serverStatus.ok .dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; animation: none; }
    #serverStatus.err .dot { background: #f87171; box-shadow: 0 0 10px #f87171; animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── SOHBET (ALT) ── */
    #chatPanel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: linear-gradient(180deg, rgba(10,10,20,0.97), rgba(5,5,12,0.99));
      border-top: 1px solid rgba(120,120,255,0.2);
      border-radius: 22px 22px 0 0;
      padding: 10px 14px 16px;
      max-height: 50vh;
      display: flex; flex-direction: column;
      transition: transform 0.3s;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    }
    #chatPanel.collapsed { transform: translateY(calc(100% - 60px)); }

    #chatHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 8px; margin-bottom: 6px;
      border-bottom: 1px solid rgba(120,120,255,0.15);
      cursor: pointer;
    }
    #chatHeader .who { display: flex; align-items: center; gap: 8px; }
    #chatHeader .who .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 10px #4ade80;
    }
    #chatHeader .who .name { font-size: 14px; font-weight: 700; }
    #chatHeader .who .role { font-size: 11px; color: #8a8aa0; margin-left: 4px; }
    #chatHeader .toggle { font-size: 11px; color: #7a7aff; font-weight: 600; }

    #messages {
      flex: 1; overflow-y: auto; padding: 4px 0;
      display: flex; flex-direction: column; gap: 6px;
      min-height: 70px; max-height: 28vh;
      -webkit-overflow-scrolling: touch;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }
    .msg {
      padding: 8px 12px; border-radius: 14px; max-width: 85%;
      font-size: 13px; line-height: 1.4;
      animation: msgIn 0.2s ease-out;
      word-wrap: break-word;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #5a5aff, #7a3aff);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(40,40,65,0.8);
      color: #e0e0f0; border-bottom-left-radius: 4px;
      border: 1px solid rgba(120,120,255,0.15);
    }
    .msg .name {
      font-size: 9px; opacity: 0.6; margin-bottom: 2px;
      display: block; font-weight: 600;
    }
    .msg.typing::after { content: "…"; animation: dots 1.2s infinite; }
    @keyframes dots {
      0%,20% { content: "·"; }
      40% { content: "··"; }
      60%,100% { content: "···"; }
    }

    #inputRow { display: flex; gap: 8px; margin-top: 8px; }
    #chatInput {
      flex: 1; background: rgba(30,30,50,0.9);
      border: 1.5px solid rgba(120,120,255,0.25);
      color: #fff; padding: 11px 14px;
      border-radius: 20px; font-size: 16px; outline: none;
      font-family: inherit;
      -webkit-appearance: none;
    }
    #chatInput:focus { border-color: #7a7aff; }
    #chatInput::placeholder { color: #6a6a8a; }
    #sendBtn {
      background: linear-gradient(135deg, #5a5aff, #b080ff);
      border: none; color: #fff;
      width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(90,90,255,0.4);
    }
    #sendBtn:active { transform: scale(0.92); }
    #sendBtn:disabled { opacity: 0.4; }

    /* ── EMİR BUTONU ── */
    #cmdFab {
      position: fixed; right: 14px; z-index: 25;
      bottom: calc(50vh + 12px);
      width: 50px; height: 50px; border-radius: 50%;
      background: linear-gradient(135deg, #7a3aff, #b080ff);
      border: none; color: #fff; font-size: 20px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(122,58,255,0.5);
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    #cmdFab.active { transform: rotate(45deg); }

    #cmdPanel {
      position: fixed; right: 14px; z-index: 26;
      bottom: calc(50vh + 72px);
      width: 280px; max-width: calc(100% - 28px);
      background: rgba(18,18,32,0.98);
      border: 1.5px solid rgba(180,100,255,0.4);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      opacity: 0; transform: translateY(20px) scale(0.95);
      pointer-events: none; transition: all 0.25s;
    }
    #cmdPanel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    #cmdPanel label {
      font-size: 10px; color: #b080ff; display: block; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800;
    }
    #cmdInput {
      width: 100%; background: rgba(30,30,50,0.9);
      border: 1.5px solid rgba(180,100,255,0.3);
      color: #fff; padding: 10px 12px;
      border-radius: 10px; font-size: 16px; outline: none;
      font-family: inherit; margin-bottom: 8px;
      -webkit-appearance: none;
    }
    #cmdInput:focus { border-color: #b080ff; }
    #cmdBtn {
      width: 100%; background: linear-gradient(135deg,#7a3aff,#b080ff);
      border: none; color: #fff; padding: 10px;
      border-radius: 10px; cursor: pointer; font-weight: 700;
      font-size: 13px;
    }
    #cmdBtn:disabled { opacity: 0.4; }

    /* ── YÜKLEME ── */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      background: radial-gradient(circle at 50% 50%, #1a1a2e, #05050a);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(122,122,255,0.2);
      border-top-color: #7a7aff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .title {
      font-size: 18px; font-weight: 800;
      background: linear-gradient(90deg,#7a7aff,#b080ff,#ff6ec7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #loading p { color: #6a6a8a; font-size: 12px; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="title">AI Karakter Odaları</div>
    <div class="spinner"></div>
    <p>Dünya hazırlanıyor…</p>
  </div>

  <div id="world">
    <div id="grid"></div>
    <!-- Odalar ve karakterler JS ile eklenecek -->
  </div>

  <div id="topbar">
    <div class="logo">⚡ AI ROOMS</div>
    <div id="serverStatus"><span class="dot"></span><span id="statusText">bağlanıyor</span></div>
  </div>

  <button id="cmdFab">⚡</button>

  <div id="cmdPanel">
    <label>Emir Ver</label>
    <input id="cmdInput" placeholder='örn. "şarkı söyle"' />
    <button id="cmdBtn">Uygula</button>
  </div>

  <div id="chatPanel">
    <div id="chatHeader">
      <div class="who">
        <span class="dot"></span>
        <span class="name" id="chatName">—</span>
        <span class="role" id="chatRole"></span>
      </div>
      <div class="toggle" id="chatToggle">aç ▴</div>
    </div>
    <div id="messages"></div>
    <div id="inputRow">
      <input id="chatInput" placeholder="Mesaj yaz…" autocomplete="off" />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
