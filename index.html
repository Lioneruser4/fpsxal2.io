<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Azerbaycan Kelime Oyunu</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #1a0033 0%, #000814 60%, #000 100%);
    color:#fff; user-select:none;
  }

  /* ═══ LAYOUT ═══ */
  #app {
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr auto;
    grid-template-areas:
      "left right"
      "game game";
    width:100vw; height:100vh;
    gap:8px; padding:8px;
  }

  /* Sol skor tablosu */
  #leftBoard { grid-area:left; }
  /* Sağ hediye tablosu */
  #rightBoard { grid-area:right; }
  /* Oyun alanı */
  #game { grid-area:game; }

  .board {
    background: linear-gradient(145deg, rgba(30,10,60,.9), rgba(10,5,30,.95));
    border:1px solid rgba(255,100,200,.3);
    border-radius:14px; padding:10px;
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow: 0 0 20px rgba(150,50,255,.15);
  }
  .board h3 {
    font-size: clamp(11px, 2.2vw, 15px);
    text-align:center; margin-bottom:8px;
    letter-spacing:1px; text-transform:uppercase;
    color:#ff7ae0; text-shadow:0 0 10px rgba(255,100,220,.6);
  }
  .board .list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  .board .list::-webkit-scrollbar { width:0; }

  .row {
    display:flex; justify-content:space-between; align-items:center;
    padding:4px 8px; border-radius:6px;
    font-size: clamp(10px, 1.9vw, 14px);
    background: rgba(255,255,255,.04);
    transition: transform .3s, background .3s;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row .name { overflow:hidden; text-overflow:ellipsis; flex:1; }
  .row .score { color:#ffd700; font-weight:bold; margin-left:6px; }
  .row .rank { color:#8af; margin-right:6px; font-weight:bold; }
  .row.new { animation: rowIn .5s ease; background: rgba(255,215,0,.2); }
  @keyframes rowIn {
    from { transform: translateX(30px); opacity:0; }
    to   { transform: translateX(0); opacity:1; }
  }

  #rightBoard .row { background: rgba(255,100,200,.08); }
  #rightBoard .score { color:#ff7ae0; }

  /* ═══ OYUN ALANI ═══ */
  #game {
    background: linear-gradient(160deg, rgba(20,0,40,.95), rgba(40,10,80,.9));
    border:2px solid rgba(255,100,220,.4);
    border-radius:18px;
    padding: 14px 10px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:10px;
    position:relative; overflow:hidden;
    box-shadow: 0 0 40px rgba(200,50,255,.25), inset 0 0 60px rgba(100,0,200,.15);
  }

  #game::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 50%, rgba(255,100,220,.1), transparent 70%);
    animation: pulse 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  #hint {
    font-size: clamp(13px, 2.8vw, 18px);
    color:#a0e0ff; text-align:center;
    letter-spacing:1px; z-index:1;
    text-shadow:0 0 8px rgba(100,200,255,.5);
  }
  #hint b { color:#ffd700; }

  #mask {
    display:flex; gap: clamp(4px, 1vw, 8px);
    flex-wrap:wrap; justify-content:center;
    z-index:1;
  }
  .letter-box {
    width: clamp(28px, 6vw, 46px);
    height: clamp(32px, 7vw, 54px);
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:2px solid rgba(255,100,220,.4);
    border-radius:8px;
    font-size: clamp(16px, 3.5vw, 26px);
    font-weight:bold;
    color:#fff;
    position:relative;
    transition: all .4s;
  }
  .letter-box.revealed {
    background: linear-gradient(180deg, rgba(255,215,0,.3), rgba(255,150,0,.15));
    border-color:#ffd700;
    color:#ffd700;
    box-shadow: 0 0 15px rgba(255,215,0,.6);
    transform: scale(1.05);
  }

  #foundFlash {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(20px, 5vw, 40px);
    font-weight:bold; text-align:center;
    background: rgba(0,0,0,.75);
    color:#ffd700; text-shadow:0 0 20px rgba(255,215,0,.9);
    opacity:0; pointer-events:none;
    transition: opacity .3s;
    padding:20px; z-index:10;
    border-radius:18px;
  }
  #foundFlash.show { opacity:1; animation: foundPulse .6s ease; }
  @keyframes foundPulse {
    0% { transform: scale(.8); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* Konfeti */
  .confetti {
    position:fixed; width:10px; height:10px;
    pointer-events:none; z-index:100;
    animation: fall 2s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity:0; }
  }

  /* Ses açma (ilk tık için) */
  #tapStart {
    position:fixed; inset:0; z-index:999;
    background:rgba(0,0,0,.85);
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(16px, 4vw, 24px);
    color:#ff7ae0; text-align:center; padding:30px;
    cursor:pointer;
  }
  #tapStart.hidden { display:none; }

  /* Mobil dikey */
  @media (max-aspect-ratio: 1/1) {
    #app {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 28% 1fr;
      grid-template-areas:
        "left right"
        "game game";
    }
  }
  /* Geniş ekran (16:9) */
  @media (min-aspect-ratio: 1/1) {
    #app {
      grid-template-columns: 22% 1fr 22%;
      grid-template-rows: 1fr;
      grid-template-areas: "left game right";
    }
  }
</style>
</head>

/* ═══════════════════════════════════════════════
   OYUN STATE
   ═══════════════════════════════════════════════ */
let currentWord = null;
let players = {};   // { name: score }
let gifters = {};   // { name: totalGiftValue }
let usedWords = new Set();

/* ═══════════════════════════════════════════════
   SES (Web Audio API - dosyasız)
   ═══════════════════════════════════════════════ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration = 0.15, type = 'sine', vol = 0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playCorrect() {
  playTone(523, .12, 'sine', .2);          // C5
  setTimeout(() => playTone(659, .12, 'sine', .2), 120); // E5
  setTimeout(() => playTone(784, .25, 'sine', .25), 240); // G5
  setTimeout(() => playTone(1047, .3, 'sine', .2), 380);  // C6
}
function playWrong() {
  playTone(220, .15, 'sawtooth', .1);
  setTimeout(() => playTone(180, .2, 'sawtooth', .1), 120);
}
function playGift() {
  playTone(880, .08, 'triangle', .15);
  setTimeout(() => playTone(1108, .1, 'triangle', .15), 80);
}

/* ═══════════════════════════════════════════════
   YENİ KELİME SEÇ
   ═══════════════════════════════════════════════ */
function pickWord() {
  const remaining = WORDS.filter(w => !usedWords.has(w.word));
  if (remaining.length === 0) usedWords.clear();
  const pool = remaining.length ? remaining : WORDS;
  currentWord = pool[Math.floor(Math.random() * pool.length)];
  usedWords.add(currentWord.word);
  renderHint();
}

function renderHint() {
  const w = currentWord.word;
  document.getElementById('hint').innerHTML =
    `İpucu: <b>${currentWord.hint}</b> • <b>${w.length}</b> hərf`;

  const mask = document.getElementById('mask');
  mask.innerHTML = '';
  for (let i = 0; i < w.length; i++) {
    const box = document.createElement('div');
    box.className = 'letter-box';
    box.textContent = i === 0 ? w[i] : '';
    if (i === 0) box.classList.add('revealed');
    mask.appendChild(box);
  }
}

/* ═══════════════════════════════════════════════
   DOĞRU CEVAP KONTROLÜ
   ═══════════════════════════════════════════════ */
function normalize(s) {
  return s.toUpperCase()
    .replace(/İ/g, 'İ').replace(/I/g, 'I')
    .trim();
}

function checkAnswer(user, text) {
  if (!currentWord) return false;

  // Yorumda kelime geçiyor mu?
  const upperText = text.toUpperCase();
  const target = currentWord.word;
  if (upperText.includes(target)) {
    correctAnswer(user);
    return true;
  }
  return false;
}

function correctAnswer(user) {
  // Skor artır
  players[user] = (players[user] || 0) + 10;
  renderBoards();

  // Animasyon
  document.getElementById('foundFlash').textContent =
    `🎉 ${user}\n"${currentWord.word}" — düzgün tapdı!`;
  document.getElementById('foundFlash').classList.add('show');
  playCorrect();
  confetti();

  // Kelime harflerini aç
  const boxes = document.querySelectorAll('.letter-box');
  boxes.forEach((b, i) => {
    setTimeout(() => {
      b.textContent = currentWord.word[i];
      b.classList.add('revealed');
    }, i * 80);
  });

  // 2.5 sn sonra yeni kelime
  setTimeout(() => {
    document.getElementById('foundFlash').classList.remove('show');
    pickWord();
  }, 2500);
}

   KONFETİ
   ═══════════════════════════════════════════════ */
function confetti() {
  const colors = ['#ff7ae0', '#ffd700', '#00e5ff', '#7cff00', '#ff5050', '#a070ff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-20px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = (1.5 + Math.random()) + 's';
    if (Math.random() > .5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

/* ═══════════════════════════════════════════════
   SKOR TABLOLARI
   ═══════════════════════════════════════════════ */
function renderBoards() {
  // Sol: Oyuncular
  const sortedPlayers = Object.entries(players)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);
  const leftList = document.getElementById('leftList');
  leftList.innerHTML = '';
  sortedPlayers.forEach(([name, score], i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="rank">${i + 1}.</span><span class="name">${name}</span><span class="score">${score}</span>`;
    leftList.appendChild(row);
  });
  if (sortedPlayers.length === 0) {
    leftList.innerHTML = '<div style="opacity:.4;text-align:center;font-size:12px;margin-top:10px;">Hələ oyunçu yoxdur</div>';
  }

  // Sağ: Hediye atanlar
  const sortedGifters = Object.entries(gifters)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);
  const rightList = document.getElementById('rightList');
  rightList.innerHTML = '';
  sortedGifters.forEach(([name, val], i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="rank">${i + 1}.</span><span class="name">${name}</span><span class="score">${val}</span>`;
    rightList.appendChild(row);
  });
  if (sortedGifters.length === 0) {
    rightList.innerHTML = '<div style="opacity:.4;text-align:center;font-size:12px;margin-top:10px;">Hələ hədiyyə yoxdur</div>';
  }
}

/* ═══════════════════════════════════════════════
   WEBSOCKET
   ═══════════════════════════════════════════════ */
let ws = null;
function connectWS() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      console.log('WS bağlandı');
      ws.send(JSON.stringify({ type: 'hello', role: 'viewer' }));
    };
    ws.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'comment') handleComment(msg.user, msg.text);
        if (msg.type === 'gift') handleGift(msg.user, msg.gift, msg.count || 1);
      } catch {}
    };
    ws.onclose = () => setTimeout(connectWS, 2000);
    ws.onerror = () => ws.close();
  } catch {
    setTimeout(connectWS, 2000);
  }
}
connectWS();

function handleComment(user, text) {
  if (checkAnswer(user, text)) return;
  // Yanlış cevap — hafif ses
  if (currentWord && text.toUpperCase().includes(currentWord.word[0])) {
    // İlk harfi doğru yazdıysa belki yakın
    // playWrong(); // çok gürültü olur, kapatıyorum
  }
}

function handleGift(user, giftName, count) {
  const value = (giftValue(giftName) || 1) * count;
  gifters[user] = (gifters[user] || 0) + value;
  renderBoards();
  playGift();
  // Görsel efekt
  document.getElementById('foundFlash').textContent = `🎁 ${user}\n${giftName} göndərdi!`;
  document.getElementById('foundFlash').classList.add('show');
  setTimeout(() => document.getElementById('foundFlash').classList.remove('show'), 1500);
}

function giftValue(name) {
  const map = { 'Rose': 1, 'TikTok': 1, 'Finger Heart': 5, 'Heart': 1, 'GG': 1, 'Doughnut': 30, 'Hand Hearts': 1, 'Ice Cream Cone': 1, 'Music Note': 1 };
  return map[name] || 1;
}

  // Her 4 sn'de bir sahte yorum (bazen doğru)
  setInterval(() => {
    const user = testUsers[Math.floor(Math.random() * testUsers.length)];
    if (currentWord && Math.random() < 0.15) {
      // Doğru cevap simülasyonu
      handleComment(user, `bilmədim ama ${currentWord.word} olsun`);
    } else {
      handleComment(user, 'salam necəsən?');
    }
  }, 4000);

  // Her 10 sn'de hediye
  setInterval(() => {
    const user = testUsers[Math.floor(Math.random() * testUsers.length)];
    const gift = testGifts[Math.floor(Math.random() * testGifts.length)];
    handleGift(user, gift, 1 + Math.floor(Math.random() * 3));
  }, 10000);

  console.log('🧪 TEST MODU AKTİF');
}

document.getElementById('tapStart').addEventListener('click', () => {
  initAudio();
  document.getElementById('tapStart').classList.add('hidden');
  pickWord();
  renderBoards();
});

// Test modunda tap ekranını otomatik geç
if (TEST_MODE) {
  document.getElementById('tapStart').classList.add('hidden');
  setTimeout(() => { initAudio(); pickWord(); renderBoards(); }, 100);
}
