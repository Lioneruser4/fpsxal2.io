<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerçekçi Trafik Simülatörü</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }
        
        /* Genel UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        .clickable { pointer-events: auto; }
        
        /* HUD */
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; color: #fff; font-weight: bold; text-shadow: 1px 1px 3px #000; font-size: 1.2rem; }
        #speed { font-size: 2rem; color: #00ffcc; }
        #lives { color: #ff4444; }
        #money { color: #ffd700; }

        /* Lobi */
        #lobby { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; pointer-events: auto; }
        #lobby h1 { font-size: 2.5rem; color: #ffd700; margin-bottom: 10px; text-align: center;}
        .btn { background: #007bff; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; margin: 10px; cursor: pointer; width: 250px; text-align: center; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #0056b3; transform: scale(1.05); }
        .btn-red { background: #dc3545; }
        .btn-red:hover { background: #a71d2a; }
        
        /* Ayarlar */
        #settings-panel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; padding: 20px; border-radius: 15px; color: white; pointer-events: auto; width: 80%; max-width: 400px; border: 2px solid #555;}
        #settings-panel label { display: block; margin: 15px 0 5px; font-weight: bold;}
        input[type=range] { width: 100%; }
        select { width: 100%; padding: 10px; border-radius: 5px; font-size: 1rem; }
        .close-btn { background: #555; margin-top: 20px; width: 100%; padding: 10px; }

        /* Kontroller */
        #controls { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 40vh; pointer-events: none; }
        
        /* Gaz / Fren */
        .pedal-container { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .pedal { width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; color: white; text-shadow: 1px 1px 2px #000; }
        #gas { background: rgba(0, 255, 0, 0.3); }
        #brake { background: rgba(255, 0, 0, 0.3); }
        #gas:active { background: rgba(0, 255, 0, 0.7); }
        #brake:active { background: rgba(255, 0, 0, 0.7); }

        /* Direksiyon / Joystick / Butonlar */
        #steering-container { position: absolute; bottom: 20px; left: 20px; pointer-events: auto; display: flex; align-items: flex-end; gap: 20px;}
        
        .steer-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 15px; color: white; font-size: 2rem; display: flex; align-items: center; justify-content: center; }
        .steer-btn:active { background: rgba(255,255,255,0.5); }
        
        #joystick-base { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; display: none; }
        #joystick-stick { width: 40px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 50%; position: absolute; top: 30px; left: 30px; }
        
        #wheel-view { width: 120px; height: 120px; border: 5px solid #fff; border-radius: 50%; position: relative; display: none; background: rgba(0,0,0,0.3);}
        #wheel-view::before { content: ''; position: absolute; top: 50%; left: 10%; width: 80%; height: 10px; background: #fff; transform: translateY(-50%); }
        #wheel-view::after { content: ''; position: absolute; top: 10%; left: 50%; width: 10px; height: 80%; background: #fff; transform: translateX(-50%); }

        /* Oyun Sonu */
        #game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(100, 0, 0, 0.8); flex-direction: column; align-items: center; justify-content: center; color: white; pointer-events: auto; z-index: 20; }
        #game-over h1 { font-size: 3rem; color: #ff4444; }
    </style>
</head>
<body>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- UI Katmanı -->
    <div id="ui-layer">
        
        <!-- HUD (Oyun İçi Bilgiler) -->
        <div id="hud">
            <div>Hız: <span id="speed">0</span> km/s</div>
            <div>Para: <span id="money">0</span> ₺</div>
            <div>Can: <span id="lives">❤❤❤</span></div>
        </div>

        <!-- Lobi -->
        <div id="lobby">
            <h1>TRAFİK SİMÜLATÖRÜ</h1>
            <p style="color:#aaa; margin-bottom: 30px;">Gerçekçi Sürüş Deneyimi</p>
            <button class="btn" onclick="startGame()">OYUNA BAŞLA</button>
            <button class="btn" onclick="openSettings()">AYARLAR</button>
        </div>

        <!-- Ayarlar -->
        <div id="settings-panel">
            <h2 style="text-align:center; margin-top:0;">Ayarlar</h2>
            
            <label>Trafik Yoğunluğu:</label>
            <input type="range" id="traffic-density" min="1" max="10" value="5">
            
            <label>Kontrol Tipi:</label>
            <select id="control-type">
                <option value="buttons">Butonlar (Sol/Sağ)</option>
                <option value="joystick">Joystick</option>
                <option value="wheel">Direksiyon</option>
            </select>
            
            <button class="btn close-btn" onclick="closeSettings()">KAYDET VE KAPAT</button>
        </div>

        <!-- Kontroller (Oyun içinde görünür) -->
        <div id="controls">
            <!-- Sol Taraf: Direksiyon / Joystick / Butonlar -->
            <div id="steering-container">
                <div id="btn-controls" style="display: flex; gap: 10px;">
                    <div class="steer-btn" id="left-btn">◀</div>
                    <div class="steer-btn" id="right-btn">▶</div>
                </div>
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
                <div id="wheel-view"></div>
            </div>

            <!-- Sağ Taraf: Gaz / Fren -->
            <div class="pedal-container">
                <div class="pedal" id="gas">GAZ</div>
                <div class="pedal" id="brake">FREN</div>
            </div>
        </div>

        <!-- Oyun Sonu Ekranı -->
        <div id="game-over">
            <h1>KAZA YAPTINIZ!</h1>
            <p id="crash-reason">Öndeki araca çarptınız.</p>
            <p>Toplanan Para: <span id="final-money">0</span> ₺</p>
            <button class="btn btn-red" onclick="restartGame()">YENİDEN BAŞLAT</button>
        </div>

    </div>

    <!-- Oyun Mantığı -->
    <script src="game.js"></script>
</body>
</html>
