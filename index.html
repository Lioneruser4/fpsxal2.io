<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Karakter Odaları</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #05050a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    #scene { position: fixed; inset: 0; display: block; z-index: 1; }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, rgba(5,5,10,0.9), transparent);
      pointer-events: none;
    }
    #topbar .logo {
      font-size: 15px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(90deg,#7a7aff,#b080ff,#ff6ec7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #serverStatus {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 600;
      padding: 5px 10px; border-radius: 20px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #serverStatus .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #fbbf24; box-shadow: 0 0 8px #fbbf24;
      animation: pulse 1.5s infinite;
    }
    #serverStatus.ok .dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; animation: none; }
    #serverStatus.err .dot { background: #f87171; box-shadow: 0 0 10px #f87171; animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    #charBar {
      position: fixed; top: 56px; left: 0; right: 0; z-index: 20;
      display: flex; gap: 8px; padding: 0 16px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #charBar::-webkit-scrollbar { display: none; }
    .charCard {
      flex-shrink: 0;
      background: rgba(20,20,35,0.85);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; transition: all 0.25s;
      backdrop-filter: blur(12px);
    }
    .charCard .avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .charCard .info { display: flex; flex-direction: column; gap: 1px; }
    .charCard .info .n { font-size: 12px; font-weight: 700; color: #fff; }
    .charCard .info .r { font-size: 9px; color: #8a8aa0; }
    .charCard.active {
      border-color: #7a7aff;
      background: linear-gradient(135deg, rgba(90,90,255,0.3), rgba(180,120,255,0.2));
      box-shadow: 0 0 20px rgba(122,122,255,0.4);
    }

    #chatPanel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: linear-gradient(180deg, rgba(10,10,20,0.95), rgba(5,5,12,0.98));
      backdrop-filter: blur(24px);
      border-top: 1px solid rgba(120,120,255,0.2);
      border-radius: 24px 24px 0 0;
      padding: 12px 16px 20px;
      max-height: 55vh;
      display: flex; flex-direction: column;
      transition: transform 0.3s;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    }
    #chatPanel.collapsed { transform: translateY(calc(100% - 68px)); }

    #chatHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 10px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(120,120,255,0.15);
      cursor: pointer;
    }
    #chatHeader .who { display: flex; align-items: center; gap: 8px; }
    #chatHeader .who .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 10px #4ade80;
    }
    #chatHeader .who .name { font-size: 14px; font-weight: 700; }
    #chatHeader .who .role { font-size: 11px; color: #8a8aa0; margin-left: 4px; }
    #chatHeader .toggle { font-size: 11px; color: #7a7aff; font-weight: 600; }

    #messages {
      flex: 1; overflow-y: auto; padding: 4px 0;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 80px; max-height: 30vh;
      -webkit-overflow-scrolling: touch;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 2px; }
    .msg {
      padding: 9px 13px; border-radius: 16px; max-width: 85%;
      font-size: 13px; line-height: 1.4;
      animation: msgIn 0.25s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #5a5aff, #7a3aff);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(40,40,65,0.8);
      color: #e0e0f0; border-bottom-left-radius: 4px;
      border: 1px solid rgba(120,120,255,0.15);
    }
    .msg .name {
      font-size: 9px; opacity: 0.6; margin-bottom: 2px;
      display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .msg.typing::after { content: "…"; animation: dots 1.2s infinite; }
    @keyframes dots {
      0%,20% { content: "·"; }
      40% { content: "··"; }
      60%,100% { content: "···"; }
    }

    #inputRow { display: flex; gap: 8px; margin-top: 10px; }
    #chatInput {
      flex: 1; background: rgba(30,30,50,0.9);
      border: 1.5px solid rgba(120,120,255,0.25);
      color: #fff; padding: 12px 16px;
      border-radius: 22px; font-size: 14px; outline: none;
      font-family: inherit;
    }
    #chatInput:focus { border-color: #7a7aff; box-shadow: 0 0 0 3px rgba(122,122,255,0.15); }
    #chatInput::placeholder { color: #6a6a8a; }
    #sendBtn {
      background: linear-gradient(135deg, #5a5aff, #b080ff);
      border: none; color: #fff;
      width: 44px; height: 44px; border-radius: 50%;
      cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(90,90,255,0.4);
      transition: transform 0.15s;
    }
    #sendBtn:active { transform: scale(0.92); }
    #sendBtn:disabled { opacity: 0.4; }

    #cmdFab {
      position: fixed; right: 16px; bottom: calc(55vh + 12px); z-index: 25;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #7a3aff, #b080ff);
      border: none; color: #fff; font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(122,58,255,0.5);
      transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    #cmdFab.active { transform: rotate(45deg); }
    #cmdFab:active { transform: scale(0.9); }

    #cmdPanel {
      position: fixed; right: 16px; z-index: 26;
      bottom: calc(55vh + 76px);
      width: 300px; max-width: calc(100% - 32px);
      background: rgba(18,18,32,0.98);
      border: 1.5px solid rgba(180,100,255,0.4);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      opacity: 0; transform: translateY(20px) scale(0.95);
      pointer-events: none; transition: all 0.25s;
    }
    #cmdPanel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    #cmdPanel label {
      font-size: 10px; color: #b080ff; display: block; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800;
    }
    #cmdInput {
      width: 100%; background: rgba(30,30,50,0.9);
      border: 1.5px solid rgba(180,100,255,0.3);
      color: #fff; padding: 10px 12px;
      border-radius: 12px; font-size: 13px; outline: none;
      font-family: inherit; margin-bottom: 10px;
    }
    #cmdInput:focus { border-color: #b080ff; }
    #cmdBtn {
      width: 100%; background: linear-gradient(135deg,#7a3aff,#b080ff);
      border: none; color: #fff; padding: 11px;
      border-radius: 12px; cursor: pointer; font-weight: 700;
      font-size: 13px;
    }
    #cmdBtn:active { transform: scale(0.98); }
    #cmdBtn:disabled { opacity: 0.4; }

    #loading {
      position: fixed; inset: 0; z-index: 200;
      background: radial-gradient(circle at 50% 50%, #1a1a2e, #05050a);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(122,122,255,0.2);
      border-top-color: #7a7aff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .title {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(90deg,#7a7aff,#b080ff,#ff6ec7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #loading p { color: #6a6a8a; font-size: 12px; }

    @media (max-width: 400px) {
      #cmdPanel { width: calc(100% - 32px); }
      #chatPanel { max-height: 60vh; }
      #cmdFab { bottom: calc(60vh + 12px); }
      #cmdPanel { bottom: calc(60vh + 76px); }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="title">AI Karakter Odaları</div>
    <div class="spinner"></div>
    <p>3D dünya hazırlanıyor…</p>
  </div>

  <canvas id="scene"></canvas>

  <div id="topbar">
    <div class="logo">⚡ AI ROOMS</div>
    <div id="serverStatus"><span class="dot"></span><span id="statusText">bağlanıyor</span></div>
  </div>

  <div id="charBar"></div>

  <button id="cmdFab" title="Emir ver">⚡</button>

  <div id="cmdPanel">
    <label>Emir Ver</label>
    <input id="cmdInput" placeholder='örn. "masaya otur", "şarkı söyle"' />
    <button id="cmdBtn">Uygula</button>
  </div>

  <div id="chatPanel">
    <div id="chatHeader">
      <div class="who">
        <span class="dot"></span>
        <span class="name" id="chatName">—</span>
        <span class="role" id="chatRole"></span>
      </div>
      <div class="toggle" id="chatToggle">aç ▴</div>
    </div>
    <div id="messages"></div>
    <div id="inputRow">
      <input id="chatInput" placeholder="Mesaj yaz…" />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
